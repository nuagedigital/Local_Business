<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Local Business Search</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <style>
        *{
            box-sizing:border-box;
        }
        body{
            font-family: Arial, sans-serif;
            margin:0;
            background:#f3f5fa;
            color:#333;
        }
        .container{
            max-width:1100px;
            margin:20px auto;
            padding:20px;
            background:white;
            border-radius:10px;
            box-shadow:0 2px 8px rgba(0,0,0,0.08);
        }
        h1{
            margin-top:0;
            font-size:24px;
            text-align:center;
            color:#2c3e50;
        }

        /* Search form */
        .search-form{
            display:grid;
            grid-template-columns: repeat(auto-fit, minmax(220px,1fr));
            gap:15px;
            margin-bottom:15px;
        }
        label{
            font-size:14px;
            color:#444;
            display:block;
            margin-bottom:4px;
        }
        input, select{
            width:100%;
            padding:8px;
            border:1px solid #ccc;
            border-radius:5px;
            font-size:14px;
        }
        button{
            padding:10px 18px;
            border:none;
            background:#3498db;
            color:white;
            font-size:16px;
            border-radius:6px;
            cursor:pointer;
        }
        button:hover{
            background:#2980b9;
        }
        #searchBtn{
            width:100%;
        }

        #loader{
            display:none;
            text-align:center;
            margin:10px 0;
            font-size:14px;
        }
        #error{
            display:none;
            color:#e74c3c;
            margin:10px 0;
            font-size:14px;
        }
        #resultsInfo{
            margin:10px 0;
            font-size:14px;
            color:#555;
        }

        /* Results grid */
        .grid{
            display:grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap:15px;
        }
        .card{
            background:#f9fbff;
            border-radius:8px;
            padding:12px 14px;
            border:1px solid #dce6f7;
            box-shadow:0 1px 4px rgba(0,0,0,0.05);
        }
        .card-title{
            font-weight:bold;
            font-size:16px;
            margin-bottom:4px;
            color:#2c3e50;
        }
        .badge{
            display:inline-block;
            font-size:11px;
            background:#eaf4ff;
            padding:2px 6px;
            border-radius:4px;
            margin-bottom:6px;
        }
        .row{
            font-size:13px;
            margin:3px 0;
            word-break:break-word;
        }
        .row strong{
            color:#34495e;
        }
        .row a{
            color:#2980b9;
            text-decoration:none;
        }
        .row a:hover{
            text-decoration:underline;
        }

        .bottom-controls{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-top:15px;
            gap:10px;
        }
        .bottom-controls button{
            flex:1;
        }

        @media (max-width:600px){
            .bottom-controls{
                flex-direction:column;
            }
            .container{
                margin:10px;
                padding:15px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Business Category Search</h1>

    <div class="search-form">
        <div>
            <label>Category</label>
            <select id="category">
                <option value="">--Select Category--</option>
                <option value="restaurants">Restaurants</option>
                <option value="coffee_shops">Coffee Shops</option>
                <option value="sports_clubs">Sports Clubs</option>
                <option value="accounting">Accounting</option>
                <option value="cpa">Cpa</option>
                <option value="school">School</option>
                <option value="university">University</option>
                <option value="college">College</option>
                <option value="high_school">High School</option>
                <option value="middle_school">Middle School</option>
                <option value="elementary_school">Elementary School</option>
                <option value="private_school">Private School</option>
                <option value="public_school">Public School</option>
                <option value="charter_school">Charter School</option>
                <option value="magnet_school">Magnet School</option>
                <option value="special_education_school">Special Education School</option>
                <option value="alternative_school">Alternative School</option>
                <option value="virtual_school">Virtual School</option>
                <option value="online_school">Online School</option>
                <option value="home_school">Home School</option>
                <option value="private_school">Private School</option>
                <option value="tax">Tax Preparation</option>
                <option value="bookkeeping">Bookkeeping</option>
                <option value="financial_planning">Financial Planning</option>
                <option value="insurance">Insurance</option>
                <option value="legal">Legal</option>
                <option value="mortgage">Mortgage</option>
                <option value="real_estate">Real Estate</option>
                <option value="tax_planning">Tax Planning</option>
                <option value="tax_services">Tax Services</option>
                <option value="tax_preparation">Tax Preparation</option>
                <option value="tax_return">Tax Return</option>
                <option value="tax_return_preparation">Tax Return Preparation</option>
            </select>
        </div>
        <div>
            <label>Location (city / area)</label>
            <input id="locationText" placeholder="e.g. Chicago, IL">
        </div>
        <div>
            <label>Latitude (optional)</label>
            <input id="lat" placeholder="e.g. 41.8781">
        </div>
        <div>
            <label>Longitude (optional)</label>
            <input id="lng" placeholder="e.g. -87.6298">
        </div>
        <div>
            <label>Page Size</label>
            <input id="limit" type="number" min="1" max="50" value="12">
        </div>
        <div style="align-self:end;">
            <button id="searchBtn">Search Businesses</button>
        </div>
    </div>

    <div id="loader">Loading...</div>
    <div id="error"></div>
    <div id="resultsInfo"></div>

    <div id="resultsGrid" class="grid"></div>

    <div class="bottom-controls">
        <button id="loadMoreBtn" style="display:none;">Load More</button>
        <!-- NEW: Export button -->
        <button id="exportBtn">Export CSV</button>
    </div>
</div>

<script>
    // Put your real RapidAPI key here
    const RAPID_KEY = "28061cc726mshce4f83d78f16e5bp122ab8jsnff801a9f4c69";

    let currentCategory = "";
    let currentLocationText = "";
    let currentLat = "";
    let currentLng = "";
    let pageSize = 12;
    let offset = 0;
    let lastBatchCount = 0;

    // Will store ALL businesses loaded for the current search (for export)
    let allResults = [];

    function buildQueryString(category, locationText){
        let q = category || "";
        if(locationText){
            if(q){
                q += " in " + locationText;
            }else{
                q = locationText;
            }
        }
        return q.trim();
    }

    function renderResults(businesses, append){
        const $grid = $("#resultsGrid");

        if(!append){
            $grid.empty();
        }

        if(!businesses || businesses.length === 0){
            if(!append){
                $("#resultsInfo").text("No results found.");
            }
            return;
        }

        businesses.forEach(function(biz){
            const name = biz.name || "Unnamed Business";
            const type = biz.type || (biz.subtypes && biz.subtypes[0]) || "";
            const rating = biz.rating !== undefined && biz.rating !== null ? biz.rating : "N/A";
            const reviews = biz.review_count || biz.reviews || 0;
            const phone = biz.phone_number || "";
            const address = biz.full_address || biz.address || "";
            const website = biz.website || "";
            const emailsFromDetails = biz.emails_and_contacts && biz.emails_and_contacts.emails
                ? biz.emails_and_contacts.emails
                : [];
            const firstEmail = emailsFromDetails.length ? emailsFromDetails[0] : "";

            const isOpenNow = biz.opening_hours && biz.opening_hours.open_now;
            const openText = (isOpenNow === true) ? "Open now" :
                             (isOpenNow === false) ? "Closed now" : "";

            const $card = $("<div>").addClass("card");

            const $title = $("<div>").addClass("card-title").text(name);
            $card.append($title);

            if(type){
                $card.append($("<div>").addClass("badge").text(type));
            }

            if(openText){
                $card.append(
                    $("<div>").addClass("row").html("<strong>Status:</strong> " + openText)
                );
            }

            $card.append(
                $("<div>").addClass("row").html("<strong>Rating:</strong> " + rating + " (" + reviews + " reviews)")
            );

            if(phone){
                $card.append(
                    $("<div>").addClass("row").html("<strong>Phone:</strong> " + phone)
                );
            }

            if(firstEmail){
                $card.append(
                    $("<div>").addClass("row").html("<strong>Email:</strong> " + firstEmail)
                );
            }

            if(website){
                const websiteRow = $("<div>").addClass("row");
                const link = $("<a>")
                    .attr("href", website)
                    .attr("target", "_blank")
                    .text(website);
                websiteRow.append($("<strong>").text("Website: ")).append(link);
                $card.append(websiteRow);
            }

            if(address){
                $card.append(
                    $("<div>").addClass("row").html("<strong>Address:</strong> " + address)
                );
            }

            $grid.append($card);
        });

        $("#resultsInfo").text("Showing " + allResults.length + " result(s).");
    }

    function fetchBusinesses(isLoadMore){
        $("#error").text("").hide();
        $("#loader").show();
        $("#loadMoreBtn").prop("disabled", true);

        const query = buildQueryString(currentCategory, currentLocationText);

        let coordinates = undefined;
        if(currentLat && currentLng){
            coordinates = currentLat + ", " + currentLng;
        }

        const payload = {
            queries: [ query ],
            limit: pageSize,
            offset: offset,
            region: "us",
            language: "en"
        };
        if(coordinates){
            payload.coordinates = coordinates;
        }

        $.ajax({
            async: true,
            crossDomain: true,
            url: "https://local-business-data.p.rapidapi.com/search",
            method: "POST",
            headers: {
                "content-type": "application/json",
                "X-RapidAPI-Key": RAPID_KEY,
                "X-RapidAPI-Host": "local-business-data.p.rapidapi.com"
            },
            data: JSON.stringify(payload)
        })
        .done(function(response){
            $("#loader").hide();

            const businesses = response && response.data ? response.data : [];
            lastBatchCount = businesses.length;

            // Save results for export
            if(isLoadMore){
                allResults = allResults.concat(businesses);
            }else{
                allResults = businesses.slice();
            }

            renderResults(businesses, isLoadMore);

            offset += businesses.length;

            if(businesses.length === pageSize){
                $("#loadMoreBtn").show().prop("disabled", false);
            }else{
                $("#loadMoreBtn").hide();
            }
        })
        .fail(function(jqXHR){
            $("#loader").hide();
            console.error(jqXHR.responseText || jqXHR.statusText);
            $("#error").text("Failed to fetch business data. Check endpoint name and your RapidAPI plan.").show();
            $("#loadMoreBtn").hide();
        });
    }

    function startNewSearch(){
        const categoryVal = $("#category").val();
        const locationTextVal = $("#locationText").val().trim();
        const latVal = $("#lat").val().trim();
        const lngVal = $("#lng").val().trim();
        const limitVal = parseInt($("#limit").val(), 10) || 12;

        if(!categoryVal){
            $("#error").text("Please select a category.").show();
            return;
        }

        currentCategory = categoryVal;
        currentLocationText = locationTextVal;
        currentLat = latVal;
        currentLng = lngVal;
        pageSize = limitVal;
        offset = 0;
        lastBatchCount = 0;
        allResults = [];

        $("#resultsGrid").empty();
        $("#resultsInfo").text("");
        $("#loadMoreBtn").hide();

        fetchBusinesses(false);
    }

    // EXPORT ALL CURRENT RESULTS TO CSV
    function exportResultsToCSV(){
        if(!allResults || allResults.length === 0){
            alert("No data to export. Please run a search first.");
            return;
        }

        const headers = [
            "Name",
            "Type",
            "Rating",
            "Phone",
            "Email",
            "Website",
            "Address"
        ];

        const rows = allResults.map(function(biz){
            const name = biz.name || "-";
            const type = biz.type || (biz.subtypes && biz.subtypes[0]) || "";
            const rating = (biz.rating !== undefined && biz.rating !== null) ? biz.rating : "-";
            const phone = biz.phone_number || "-";
            const address = biz.full_address || biz.address || "-";
            const website = biz.website || "";
            const emailsFromDetails = biz.emails_and_contacts && biz.emails_and_contacts.emails
                ? biz.emails_and_contacts.emails
                : [];
            const firstEmail = emailsFromDetails.length ? emailsFromDetails[0] : "-";

            return [name, type, rating, phone, firstEmail, website, address];
        });

        function escapeCSV(value){
            const str = String(value === undefined || value === null ? "" : value);
            const needsQuotes = /[",\r\n]/.test(str);
            const escaped = str.replace(/"/g, '""');
            return needsQuotes ? `"${escaped}"` : escaped;
        }

        const csvLines = [];
        csvLines.push(headers.map(escapeCSV).join(","));
        rows.forEach(function(row){
            csvLines.push(row.map(escapeCSV).join(","));
        });

        const csvContent = csvLines.join("\r\n");

        const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
        const url = URL.createObjectURL(blob);

        const a = document.createElement("a");
        a.href = url;

        const safeCategory = currentCategory || "businesses";
        const safeLocation = currentLocationText || "all_locations";
        a.download = (safeCategory + "_" + safeLocation + ".csv").replace(/\s+/g, "_");

        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);

        URL.revokeObjectURL(url);
    }

    $(document).ready(function(){
        $("#searchBtn").on("click", function(){
            startNewSearch();
        });

        // Enter key triggers search
        $("#locationText, #lat, #lng, #limit").on("keypress", function(e){
            if(e.which === 13){
                startNewSearch();
            }
        });

        $("#category").on("change", function(){
            // Optional: auto-search on category change if location already set
            // if($(this).val()){
            //     startNewSearch();
            // }
        });

        $("#loadMoreBtn").on("click", function(){
            fetchBusinesses(true);
        });

        $("#exportBtn").on("click", function(){
            exportResultsToCSV();
        });
    });
</script>

</body>
</html>
